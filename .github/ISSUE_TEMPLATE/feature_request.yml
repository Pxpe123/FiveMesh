name: Feature request
description: Suggest a new viewer, editor, or pipeline feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should FiveMesh let you do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine
        - Server
        - Web
        - Contracts
        - Documentation
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Add any extra context, examples, or limitations.
    validations:
      required: false
